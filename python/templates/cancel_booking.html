<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Bookings | Smart Bus</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="page-width app-page">{% include '_nav.html' %}<main class="content-wrap narrow"><div class="page-intro"><p class="eyebrow">Customer bookings</p><h1>Cancel a booking</h1><p>Enter a booking ID to release its seat.</p></div>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}{% if message %}<div class="alert success">{{ message }}</div>{% endif %}<section class="panel form-panel cancel-panel"><form method="post" class="inline-form"><label>Booking ID<input name="booking_code" value="{{ booking_code }}" placeholder="BK1001" required></label><button class="button" type="submit">Cancel Booking</button></form><p class="field-note">Cancellation keeps the booking history and makes the seat available again.</p></section><a class="back-link" href="{{ url_for('customer') }}">← Back to customer dashboard</a></main></div></body></html>
