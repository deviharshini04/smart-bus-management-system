<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose Seats | Smart Bus</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="page-width app-page">{% include '_nav.html' %}<main class="content-wrap narrow"><a class="back-link" href="{{ url_for('customer') }}">← Back to search</a><section class="quantity-card panel"><p class="eyebrow">{{ bus.bus_name }} · {{ bus.bus_number }}</p><h1>How many seats?</h1><p class="route-large">{{ bus.source }} <span>→</span> {{ bus.destination }}</p><p class="muted">Choose between 1 and 6 seats for this booking. You will select the exact seats on the next step.</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('choose_seat_count', bus_id=bus.id) }}" class="quantity-form"><label>Seats requested<select name="seat_count" required><option value="">Select quantity</option>{% for count in range(1, 7) %}<option value="{{ count }}">{{ count }} seat{% if count != 1 %}s{% endif %}</option>{% endfor %}</select></label><button class="button" type="submit">Continue to Seat Selection</button></form></section></main></div></body></html>
