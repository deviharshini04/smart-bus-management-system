<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Account | Smart Bus</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="auth-shell"><div class="auth-panel"><a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">SB</span><span>SMART BUS</span></a><div class="auth-heading"><p class="eyebrow">Join the network</p><h1>Create your account</h1><p>Choose a role to get started with the local prototype.</p></div>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post" class="stack-form"><label>Full Name<input name="name" value="{{ form.get('name','') }}" required></label><label>Email Address<input type="email" name="email" value="{{ form.get('email','') }}" required></label><div class="form-two"><label>Password<input type="password" name="password" required></label><label>Confirm Password<input type="password" name="confirm_password" required></label></div><fieldset><legend>Choose Account Type</legend><div class="role-grid"><label class="role-option"><input type="radio" name="role" value="OWNER" {% if form.get('role') == 'OWNER' %}checked{% endif %} required><span><strong>BUS OWNER</strong><small>Register and manage buses</small></span></label><label class="role-option"><input type="radio" name="role" value="CUSTOMER" {% if form.get('role') == 'CUSTOMER' %}checked{% endif %} required><span><strong>CUSTOMER</strong><small>Find buses and reserve seats</small></span></label></div></fieldset><button class="button full" type="submit">Create Account</button></form><p class="auth-switch">Already have an account? <a href="{{ url_for('signin') }}">Sign In</a></p></div></main></body></html>
